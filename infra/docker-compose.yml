# GeoMarketingLab — whole stack on one machine (doc §9: "one command reproduces the system").
#
#   cd infra && cp ../.env.example ../.env   # then fill in secrets
#   docker compose --env-file ../.env up -d --build
#   docker compose --env-file ../.env --profile local-llm up -d   # + Ollama
#
# Host ports (override RUSTFS_S3_PORT / RUSTFS_CONSOLE_PORT / POSTGRES_PORT in .env if taken):
#        web 8080 · API 8000 · MCP 8765 · Airflow 8081 · MLflow 5000 · RustFS 9000 (S3) / 9001 (console)
#        · Martin tiles 3000 · Postgres 5432
name: geomlab

x-geomlab-env: &geomlab-env
  LAKE_URI: s3://lakehouse
  S3_ENDPOINT_URL: http://rustfs:9000
  AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
  AWS_REGION: us-east-1
  WAREHOUSE_DUCKDB: /data/warehouse.duckdb
  DATA_DIR: /data
  CONFIG_DIR: /app/config
  CORPUS_DIR: /app/corpus
  DBT_DIR: /app/dbt
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/geomlab
  DATABASE_URL_RO: postgresql+psycopg://geomlab_ro:${GEOMLAB_RO_PASSWORD}@postgres:5432/geomlab
  DATABASE_URL_SQL: postgresql+psycopg://geomlab_sql:${GEOMLAB_SQL_PASSWORD}@postgres:5432/geomlab
  MLFLOW_TRACKING_URI: http://mlflow:5000
  EARTHENGINE_PROJECT: ${EARTHENGINE_PROJECT:-}
  GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
  # the host key directory GEE_KEY_DIR is mounted read-only at /run/secrets/gee
  GEE_SERVICE_ACCOUNT_KEY_PATH: /run/secrets/gee/${GEE_KEY_FILE:-key.json}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence-transformers}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  HF_HOME: /data/hf
  API_KEYS: ${API_KEYS:-}
  MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}

x-airflow: &airflow
  build: {context: .., dockerfile: infra/docker/airflow.Dockerfile}
  image: geomlab-airflow:local
  environment:
    <<: *geomlab-env
    CONFIG_DIR: /opt/geomlab/config
    CORPUS_DIR: /opt/geomlab/corpus
    DBT_DIR: /opt/geomlab/dbt
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    PYTHONPATH: /opt/airflow/dags  # shared _common.py next to the DAGs
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
  volumes:
    - ../airflow/dags:/opt/airflow/dags:ro
    - ../config:/opt/geomlab/config:ro
    - ../dbt:/opt/geomlab/dbt
    - ../corpus:/opt/geomlab/corpus:ro
    - geomlab-data:/data
    - ${GEE_KEY_DIR:-./secrets}:/run/secrets/gee:ro
  depends_on:
    postgres: {condition: service_healthy}
    rustfs: {condition: service_healthy}

services:
  postgres:
    build: {context: ., dockerfile: docker/postgres.Dockerfile}
    image: geomlab-postgres:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: geomlab
      GEOMLAB_RO_PASSWORD: ${GEOMLAB_RO_PASSWORD}
      GEOMLAB_SQL_PASSWORD: ${GEOMLAB_SQL_PASSWORD}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d geomlab"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:
    # S3-compatible object storage for the lakehouse (bronze/silver/gold) and MLflow artifacts.
    image: rustfs/rustfs:1.0.3
    security_opt: ["no-new-privileges:true"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    ports: ["${RUSTFS_S3_PORT:-9000}:9000", "${RUSTFS_CONSOLE_PORT:-9001}:9001"]
    volumes: [rustfsdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  init:
    # One-shot: create buckets, serving schema and grants.
    build: {context: .., dockerfile: infra/docker/geomlab.Dockerfile}
    image: geomlab-python:local
    environment: *geomlab-env
    command: ["sh", "-c", "geomlab lake-init && geomlab db-init"]
    depends_on:
      postgres: {condition: service_healthy}
      rustfs: {condition: service_healthy}
    restart: "no"

  mlflow:
    image: geomlab-python:local
    environment:
      <<: *geomlab-env
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow/artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1:5000"
    ports: ["5000:5000"]
    depends_on:
      init: {condition: service_completed_successfully}

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports: ["8081:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-triggerer:
    <<: *airflow
    command: triggerer
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  api:
    image: geomlab-python:local
    environment: *geomlab-env
    volumes:
      - geomlab-data:/data
      - ../corpus:/app/corpus:ro
    ports: ["8000:8000"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health"]
      interval: 20s

  mcp:
    image: geomlab-python:local
    environment: *geomlab-env
    command: ["geomlab-mcp", "--http", "--port", "8765"]
    volumes: [geomlab-data:/data]
    ports: ["8765:8765"]
    depends_on:
      init: {condition: service_completed_successfully}

  martin:
    image: ghcr.io/maplibre/martin:1.0.0
    command: ["--config", "/config/martin.yaml"]
    environment:
      DATABASE_URL_TILES: postgresql://geomlab_ro:${GEOMLAB_RO_PASSWORD}@postgres:5432/geomlab
    volumes: [./martin.yaml:/config/martin.yaml:ro]
    ports: ["3000:3000"]
    depends_on:
      init: {condition: service_completed_successfully}

  web:
    build: {context: ../web}
    image: geomlab-web:local
    ports: ["8080:80"]
    depends_on: [api, martin]

  ollama:
    image: ollama/ollama:0.40.8
    profiles: ["local-llm"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata:
  rustfsdata:
  geomlab-data:
  ollama:
