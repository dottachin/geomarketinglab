name: ci
on:
  push: {branches: [main, develop]}
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[all]"
      - run: ruff check geomlab tests airflow
      - run: ruff format --check geomlab tests airflow || true   # advisory until the code base is formatted
      - name: unit + synthetic end-to-end tests (includes dbt build + dbt tests)
        run: python -m pytest
        env: {EMBEDDING_BACKEND: hash}
      - name: dbt parse
        run: cd dbt && dbt parse --profiles-dir .
        env: {LAKE_URI: /tmp/lake, WAREHOUSE_DUCKDB: /tmp/wh.duckdb}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd web && npm install && npm run build

  images:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: cd infra && docker compose --env-file ../.env build
