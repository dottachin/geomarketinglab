[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geomlab"
version = "0.1.0"
description = "GeoMarketingLab - geospatial business-location recommendation platform (lakehouse + DL + RAG/MCP)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Issam" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "h3>=4.1",
    "networkx>=3.2",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "pyyaml>=6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "deltalake>=0.25",
    "duckdb>=1.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
ingestion = [
    "osmium>=4.0",
    "osmnx>=2.0",
    "earthengine-api>=1.0",
    "openpyxl>=3.1",
]
ml = [
    "lightgbm>=4.3",
    "torch>=2.3",
    "torch-geometric>=2.5",
    "mlflow>=2.16",
    "boto3>=1.34",  # MLflow artifacts on RustFS (S3 API)
]
genai = [
    "anthropic>=0.40",
    "mcp>=2.0",
    "pgvector>=0.3",
    "pypdf>=4.2",
    "sqlglot>=25",
    "sentence-transformers>=3.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
all = ["geomlab[ingestion,ml,genai,api,dbt,dev]"]

[project.scripts]
geomlab = "geomlab.cli:main"
geomlab-mcp = "geomlab.mcp_server:main"

[tool.setuptools.packages.find]
include = ["geomlab*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs the docker-compose stack (PostGIS, MinIO, MLflow)"]
filterwarnings = ["ignore::DeprecationWarning"]
