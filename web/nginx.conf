server {
  listen 80;
  gzip on;
  gzip_types application/json application/x-protobuf text/css application/javascript;
  root /usr/share/nginx/html;
  # Docker's embedded DNS: re-resolve service names so recreated containers are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / { try_files $uri /index.html; }
  # streamed chat: pass every event through as soon as the API writes it
  location = /api/chat/stream {
    set $api api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 330s;
  }
  location /api/ {
    set $api api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api;
    proxy_read_timeout 300s;   # chat answers can take a while
  }
  location /tiles/ {
    set $tiles martin:3000;
    rewrite ^/tiles/(.*)$ /$1 break;
    proxy_pass http://$tiles;
  }
}
